# Builds and pushes SHA-tagged images to GHCR on every push to main, so a bad
# deploy has something to roll back TO (previously: compose.yaml only ever
# `build:`s locally, so `git pull && compose build && up` had no prior version to
# fall back on). Additive only — compose.yaml still `build:`s locally; wiring a
# deploy to `image:` + one of these tags is a separate, deliberate step.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: services/api
            target: api
          - image: collector
            context: services/api
            target: collector
          - image: differ
            context: services/differ
            target: ""
          - image: web
            context: web
            target: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/s4rciv-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
