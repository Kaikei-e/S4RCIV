# Builds and pushes SHA-tagged images to GHCR on every push to main, so a bad
# deploy has something to roll back TO (previously: compose.yaml only ever
# `build:`s locally, so `git pull && compose build && up` had no prior version to
# fall back on). Additive only — compose.yaml still `build:`s locally; wiring a
# deploy to `image:` + one of these tags is a separate, deliberate step.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: services/api
            target: api
          - image: collector
            context: services/api
            target: collector
          - image: differ
            context: services/differ
            target: ""
          - image: web
            context: web
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/s4rciv-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
