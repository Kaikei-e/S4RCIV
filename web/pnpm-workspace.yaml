allowBuilds:
  esbuild: true

# Force the transitive `cookie` dep to the patched line. @sveltejs/kit pins
# cookie@^0.6.0 (even at latest), which excludes the 0.7.0 fix for the
# out-of-bounds-character advisory, so we override it here (GHSA cookie <0.7.0).
# Force the transitive `undici` (via @connectrpc/connect-node + jsdom) to the
# 7.28.0 line, which fixes 7 advisories — 3 HIGH (SOCKS5 cross-origin routing
# GHSA-hm92-r4w5-c3mj, SOCKS5 TLS-validation bypass GHSA-vmh5-mc38-953g,
# WebSocket DoS GHSA-vxpw-j846-p89q) plus header-injection / cache / Set-Cookie
# issues. Pinned to ^7.28.0 to stay on the 7.x line connect-node expects, not 8.x.
# Force `esbuild` (via vite) to the 0.28.1 line, fixing GHSA-g7r4-m6w7-qqqr (dev
# server arbitrary file read). vite declares esbuild ^0.27.0 || ^0.28.0, so 0.28.x
# is within range — no semver conflict.
overrides:
  cookie@<0.7.0: '^0.7.0'
  undici: '^7.28.0'
  esbuild: '^0.28.1'
