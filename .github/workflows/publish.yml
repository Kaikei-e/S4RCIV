# Builds and pushes SHA-tagged images to GHCR on every push to main, so a bad
# deploy has something to roll back TO (previously: compose.yaml only ever
# `build:`s locally, so `git pull && compose build && up` had no prior version to
# fall back on). Additive only — compose.yaml still `build:`s locally; wiring a
# deploy to `image:` + one of these tags is a separate, deliberate step.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: services/api
            target: api
          - image: collector
            context: services/api
            target: collector
          - image: differ
            context: services/differ
            target: ""
          - image: web
            context: web
            target: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/s4rciv-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
